    <rect class="led" x="699" y="96" width="26" height="26" rx="7" style="animation-delay:-3.08s"/>
    <rect class="led" x="733" y="96" width="26" height="26" rx="7" style="animation-delay:-3.3s"/>
    <rect class="led" x="767" y="96" width="26" height="26" rx="7" style="animation-delay:-3.52s"/>
    <rect class="led" x="801" y="96" width="26" height="26" rx="7" style="animation-delay:-3.74s"/>
    <rect class="led" x="835" y="96" width="26" height="26" rx="7" style="animation-delay:-3.96s"/>
    <rect class="led" x="869" y="96" width="26" height="26" rx="7" style="animation-delay:-4.18s"/>
    <rect class="led" x="903" y="96" width="26" height="26" rx="7" style="animation-delay:-4.4s"/>
    <rect class="led" x="937" y="96" width="26" height="26" rx="7" style="animation-delay:-4.62s"/>
    <rect class="led" x="971" y="96" width="26" height="26" rx="7" style="animation-delay:-4.84s"/>
    <rect class="led" x="1005" y="96" width="26" height="26" rx="7" style="animation-delay:-5.06s"/>
    <rect class="led" x="1039" y="96" width="26" height="26" rx="7" style="animation-delay:-5.28s"/>
  </g>

  <text x="640" y="222" text-anchor="middle" font-size="60" font-weight="700" letter-spacing="-1.5" fill="url(#title)">Panda Status P2</text>
  <text x="640" y="262" text-anchor="middle" font-size="21" fill="#9a9aa2">Open custom firmware for the BIQU light bar on Bambu Lab P2S and X2D</text>

  <g transform="translate(640 312)" font-size="14" font-weight="600">
    <rect class="pill" x="-216" y="-16" width="132" height="30" rx="15"/>
    <text class="pt" x="-150" y="5" text-anchor="middle">Cool-down state</text>
    <rect class="pill" x="-72" y="-16" width="144" height="30" rx="15"/>
    <text class="pt" x="0" y="5" text-anchor="middle">17 lighting effects</text>
    <rect class="pill" x="84" y="-16" width="132" height="30" rx="15"/>
    <text class="pt" x="150" y="5" text-anchor="middle">Open HTTP API</text>
  </g>
</svg>