; Custom firmware for the BIQU Panda Status P2 (ESP32-C3, 4 MB, 25 LEDs on GPIO 5).
; Build with `pio run` in this folder; see ../README.md.
[env:panda]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
; The stock partition table, unchanged: the image goes over the air into
; whichever app slot is not running, and stock keeps working from the other.
board_build.partitions = partitions.csv
; Same flash settings the stock image header carries (DIO, 4 MB).
board_build.flash_mode = dio
board_upload.flash_size = 4MB
; The USB-C port is a CH340 on UART0, not the chip's native USB, so logs go
; to the UART and the USB-CDC console must stay off.
build_flags =
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DCORE_DEBUG_LEVEL=1
lib_deps =
  adafruit/Adafruit NeoPixel@^1.12.3
  bblanchon/ArduinoJson@^7.2.0
monitor_speed = 115200
