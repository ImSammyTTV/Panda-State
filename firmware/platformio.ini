; Custom firmware for BIQU's ESP32-C3 light boards. One image per board:
;   pio run -e panda    Panda Status P2 (25 LEDs on GPIO 5, ES8311 microphone)
;   pio run -e status   original Panda Status (WS2812 strip on GPIO 5, length is a setting)
;   pio run -e rgb      Panda RGB Controller (two 12 V RGB channels on PWM)
; See ../README.md.
[platformio]
default_envs = panda

[common]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
; The stock partition table, unchanged: the image goes over the air into
; whichever app slot is not running, and stock keeps working from the other.
board_build.partitions = partitions.csv
; Same flash settings the stock image header carries (DIO, 4 MB).
board_build.flash_mode = dio
board_upload.flash_size = 4MB
; The USB-C port is a CH340 on UART0, not the chip's native USB, so logs go
; to the UART and the USB-CDC console must stay off.
build_flags =
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DCORE_DEBUG_LEVEL=1
lib_deps =
  adafruit/Adafruit NeoPixel@^1.12.3
  bblanchon/ArduinoJson@^7.2.0
  knolleary/PubSubClient@^2.8
monitor_speed = 115200

[env:panda]
extends = common

[env:status]
extends = common
build_flags = ${common.build_flags} -DBOARD_STATUS

[env:rgb]
extends = common
build_flags = ${common.build_flags} -DBOARD_RGB

[env:lux]
extends = common
build_flags = ${common.build_flags} -DBOARD_LUX
